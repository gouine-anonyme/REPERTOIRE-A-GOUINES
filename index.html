<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Répertoire à gouines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root {
    --noir: #0b0809;
    --creme: #f2ead7;
    --rouge: #d8454f;
    --marge: 4vw;
    --police: "Archivo Black", "Arial Black", "Helvetica Neue", Impact, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--noir);
    padding: var(--marge);
  }
  .titre {
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* répartit l'espace restant entre les titres */
    width: 100%;
    min-height: calc(100vh - 2 * var(--marge));
    min-height: calc(100svh - 2 * var(--marge));
    text-decoration: none;
    color: var(--creme);
    font-family: var(--police);
    text-transform: uppercase;
    text-align: center;
    line-height: .9;
    letter-spacing: -0.02em;
    cursor: pointer;
  }
  .bloc { width: 100%; }
  .ligne {
    display: inline-block;
    white-space: nowrap;
    font-size: 13vw; /* ajusté ensuite par le script pour remplir la largeur */
  }
  .titre:hover, .titre:focus-visible { color: var(--rouge); }
  .titre:focus-visible { outline: 3px solid var(--creme); outline-offset: 1.5vw; }
</style>
</head>
<body>
  <a class="titre" id="titre" href="annuaire.html" aria-label="Répertoire à gouines : entrer dans le répertoire">
    <div class="bloc" aria-hidden="true">
      <span class="ligne">Repertoire</span><br>
      <span class="ligne">a gouines</span>
    </div>
  </a>

<script>
  // 1) Choisit la mise en forme : écran large = titre sur une seule ligne,
  //    écran en hauteur (téléphone) = titre sur deux lignes.
  // 2) Étire chaque ligne pour qu'elle occupe toute la largeur.
  // 3) Répète le titre autant de fois que la hauteur de la page le permet.
  const zone = document.getElementById('titre');

  function creerBloc(lignes) {
    const bloc = document.createElement('div');
    bloc.className = 'bloc';
    bloc.setAttribute('aria-hidden', 'true');
    lignes.forEach((texte, i) => {
      if (i > 0) bloc.appendChild(document.createElement('br'));
      const span = document.createElement('span');
      span.className = 'ligne';
      span.textContent = texte;
      bloc.appendChild(span);
    });
    return bloc;
  }

  function construire() {
    zone.replaceChildren();
    zone.style.gap = '';

    const large = window.innerWidth > window.innerHeight;
    const lignes = large ? ['Repertoire a gouines'] : ['Repertoire', 'a gouines'];
    const bloc = creerBloc(lignes);
    zone.appendChild(bloc);

    const largeur = zone.clientWidth;
    bloc.querySelectorAll('.ligne').forEach(l => {
      l.style.fontSize = '100px';
      const w = l.getBoundingClientRect().width;
      if (w > 0) l.style.fontSize = (100 * largeur / w) + 'px';
    });

    const hauteurBloc = bloc.getBoundingClientRect().height;
    const ecart = Math.max(12, hauteurBloc * 0.3);          // espace minimum entre deux titres
    const marge = window.innerWidth * 0.04;
    const dispo = window.innerHeight - 2 * marge;
    const n = Math.max(1, Math.floor((dispo + ecart) / (hauteurBloc + ecart)));

    zone.style.gap = ecart + 'px';
    for (let i = 1; i < n; i++) zone.appendChild(bloc.cloneNode(true));
  }

  let attente;
  window.addEventListener('resize', () => { clearTimeout(attente); attente = setTimeout(construire, 100); });
  window.addEventListener('load', construire);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(construire);
  construire();
</script>
</body>
</html>

<title>Es-tu gouine ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root {
    --noir: #0b0809;
    --creme: #f2ead7;
    --rouge: #d8454f;
    --police: "Archivo Black", "Arial Black", "Helvetica Neue", Impact, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    background: var(--noir);
    color: var(--creme);
    font-family: var(--police);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.2rem, 4vh, 2.5rem);
    padding: 4vw;
  }

  .affiche {
    display: block;
    height: min(68vh, 68svh, 900px);
    max-width: 100%;
    width: auto;
    object-fit: contain;
  }

  fieldset { border: 0; margin: 0; padding: 0; }
  legend {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .choix {
    display: flex;
    justify-content: center;
    gap: clamp(2rem, 8vw, 6rem);
  }
  .option {
    display: flex;
    align-items: center;
    gap: .4em;
    font-size: clamp(2rem, 6vw, 4rem);
    line-height: 1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .option { color: var(--rouge); }
  .option:hover { color: var(--creme); }

  .option input {
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    width: 1em;
    height: 1em;
    border: .1em solid currentColor;
    background: transparent;
    color: inherit;
    font: inherit;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .option input::after {
    content: "X";
    font-size: .8em;
    line-height: 1;
    color: var(--noir);
    visibility: hidden;
  }
  .option input:checked { background: var(--rouge); }
  .option input:checked::after { visibility: visible; }
  .option:hover input:checked { background: var(--creme); border-color: var(--creme); }
  .option input:focus-visible { outline: 3px solid var(--creme); outline-offset: 4px; }
</style>
</head>
